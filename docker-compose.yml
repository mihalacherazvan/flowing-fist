# Local database for development and tests: `docker compose up -d`
services:
  database:
    image: mariadb:11.4
    ports:
      - '${DATABASE_PORT:-3307}:3306'
    environment:
      MARIADB_ROOT_PASSWORD: flowing_fist
      MARIADB_DATABASE: flowing_fist
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  database:
